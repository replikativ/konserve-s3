version: 2.1

orbs:
  tools: replikativ/clj-tools@0

jobs:
  cljs-integration:
    docker:
      - image: ghcr.io/replikativ/circleci-orb:latest
        auth:
          username: $GHCR_LOGIN
          password: $GHCR_PASSWORD
      - image: minio/minio:latest
        auth:
          username: $DOCKER_LOGIN
          password: $DOCKER_PASSWORD
        command: server /data
        environment:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - checkout
      - run:
          name: Wait for MinIO
          command: |
            for i in $(seq 1 30); do
              curl -sf http://localhost:9000/minio/health/live && break
              sleep 1
            done
      - run:
          name: Create test bucket
          command: |
            curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
            chmod +x /tmp/mc
            /tmp/mc alias set local http://localhost:9000 minioadmin minioadmin
            /tmp/mc mb local/konserve-test
      - run:
          name: Install npm deps
          command: npm ci
      - run:
          name: Compile node-test bundle
          command: npx shadow-cljs compile node-test
          no_output_timeout: 5m
      - run:
          name: Run cljs node integration suite against MinIO (compliance + minio)
          environment:
            S3_ENDPOINT: http://localhost:9000
            S3_BUCKET: konserve-test
            S3_ACCESS_KEY: minioadmin
            S3_SECRET: minioadmin
            S3_REGION: us-east-1
            S3_PATH_STYLE: "true"
          command: node target/node-tests.js
      - run:
          name: Build browser integration bundle
          command: npx shadow-cljs release integration
          no_output_timeout: 5m
      - run:
          name: Run cljs browser integration against MinIO (ChromeHeadless)
          # Config is baked into the bundle via goog-define and defaults to this
          # MinIO (localhost:9000, konserve-test, minioadmin); see the test ns.
          command: |
            export CHROME_BIN="${CHROME_BIN:-$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)}"
            echo "Using CHROME_BIN=$CHROME_BIN"
            npx karma start karma.integration.conf.js --single-run
  # Cheap, always-on gate: load the namespace against the PINNED konserve, with no
  # external service. A stale/incompatible konserve pin (e.g. one missing
  # PReadMissSafe) fails here immediately — this is exactly the class of bug that
  # shipped when the konserve 0.9.353 pin reached Clojars (the deploy built a
  # source jar and unit tests were off, so nothing ever loaded the ns).
  smoke:
    docker:
      - image: clojure:temurin-21-tools-deps
    steps:
      - checkout
      - run:
          name: load namespace against pinned konserve
          command: clojure -M -e "(require 'konserve-s3.core)(println :loaded)"

  # Reflection is a latency cost on the JVM and a correctness cost under
  # native-image, where a reflective call resolves at run time and so works
  # only if the target was registered when the image was built. Datahike
  # compiles this backend into `dthk`, so a reflective call added here becomes
  # a runtime failure in a shipped binary. Gate on our own namespaces only —
  # a dependency's warnings are real but are not fixable from here.
  reflection:
    docker:
      - image: clojure:temurin-21-tools-deps
    steps:
      - checkout
      - run:
          name: fail on reflective calls
          command: |
            NSES=$(find src -name '*.clj' -o -name '*.cljc' \
                     | sed 's|^src/||; s|\.cljc\?$||; s|/|.|g; s|_|-|g' \
                     | sort -u | sed "s/^/'/" | tr '\n' ' ')
            clojure -M -e "(set! *warn-on-reflection* true)(doseq [n [$NSES]] (require n))(println :loaded)" \
              > /tmp/refl.out 2> /tmp/refl.err || { cat /tmp/refl.err; exit 1; }
            if grep -q '^Reflection warning.*konserve_s3/' /tmp/refl.err; then
              echo "Reflective calls in konserve-s3 sources:"
              grep '^Reflection warning.*konserve_s3/' /tmp/refl.err
              echo
              echo "Add a type hint. Under native-image these fail at run time."
              exit 1
            fi
            echo "No reflective calls in konserve-s3 sources."

  # Integration tests against a MinIO service container. On the docker executor the
  # secondary image is reachable on localhost, matching the tests' localhost:9000
  # spec; the tests self-create the bucket (konserve-s3 -create-store).
  unittest:
    docker:
      - image: clojure:temurin-21-tools-deps
      - image: minio/minio:latest
        environment:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        command: server /data
    steps:
      - checkout
      - run:
          name: wait for MinIO on :9000
          command: |
            for i in $(seq 1 60); do (echo > /dev/tcp/localhost/9000) 2>/dev/null && exit 0; sleep 1; done
            echo "MinIO did not come up on :9000"; exit 1
      - run:
          name: run tests against MinIO
          command: |
            clojure -M:test -e "(require '[clojure.test :as t] 'konserve-s3.core-test 'konserve-s3.minio-test)(let [{:keys [fail error]} (t/run-tests 'konserve-s3.core-test 'konserve-s3.minio-test)](when (or (pos? fail) (pos? error)) (System/exit 1)))"

workflows:
  build-test-and-deploy:
    jobs:
      - tools/setup:
          context: docker-deploy
          setup_cljs: true
      - tools/build:
          context: docker-deploy
          build_cljs: true
          requires:
            - tools/setup
      - tools/format:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/cljstest:
          context: docker-deploy
          requires:
            - tools/build
      - cljs-integration:
          context: docker-deploy
          requires:
            - tools/build
      - smoke
      - reflection
      - unittest
      - tools/deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/build
            - tools/format
            - tools/cljstest
            - cljs-integration
            - smoke
            - unittest
      - tools/release:
          context:
            - github-token
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy
